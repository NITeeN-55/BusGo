<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>BusGo Admin Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ════ RESET & VARIABLES ════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--bg2:#141720;--bg3:#1c2030;--bg4:#242840;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --accent:#e8521a;--accent2:#ff6b35;--glow:rgba(232,82,26,0.2);
  --green:#22c55e;--green-bg:rgba(34,197,94,0.1);
  --yellow:#f59e0b;--yellow-bg:rgba(245,158,11,0.1);
  --red:#ef4444;--red-bg:rgba(239,68,68,0.1);
  --blue:#3b82f6;--blue-bg:rgba(59,130,246,0.1);
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--text4:#475569;
  --sw:240px;--th:60px;--r:12px;--rs:8px;
  --font:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(-10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.fade-in{animation:fadeIn .3s ease}

/* ════ LOGIN ════ */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(232,82,26,.13) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(59,130,246,.08) 0%,transparent 50%),var(--bg)}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px}
.orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.orb1{width:400px;height:400px;background:rgba(232,82,26,.15);top:-100px;left:-100px}
.orb2{width:300px;height:300px;background:rgba(59,130,246,.1);bottom:-80px;right:-80px}
.login-card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:40px;box-shadow:var(--shadow),0 0 60px rgba(232,82,26,.08)}
.lc-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.lc-logo-icon{font-size:2rem}
.lc-name{font-size:1.5rem;font-weight:700;letter-spacing:-.5px}
.lc-name span{color:var(--accent)}
.lc-sub{font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:500}
.login-title{font-size:1.4rem;font-weight:700;margin-bottom:6px}
.login-desc{font-size:.85rem;color:var(--text3);margin-bottom:28px}
.login-alert{display:none;padding:12px 14px;border-radius:var(--rs);font-size:.84rem;margin-bottom:20px;background:var(--red-bg);border:1px solid rgba(239,68,68,.25);color:#fca5a5}
.login-alert.show{display:block}
.login-alert.ok{background:var(--green-bg);border-color:rgba(34,197,94,.25);color:#86efac}
.lf-field{margin-bottom:18px}
.lf-label{display:block;font-size:.78rem;font-weight:600;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.lf-wrap{position:relative;display:flex;align-items:center}
.lf-icon{position:absolute;left:13px;width:16px;height:16px;color:var(--text4);pointer-events:none;flex-shrink:0}
.lf-wrap input{width:100%;padding:11px 14px 11px 40px;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:var(--font);font-size:.92rem;outline:none;transition:border-color .2s,box-shadow .2s}
.lf-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.lf-eye{position:absolute;right:12px;background:none;border:none;cursor:pointer;color:var(--text4);padding:4px;display:flex}
.lf-eye svg{width:16px;height:16px}
.btn-login{width:100%;padding:13px;border-radius:var(--rs);background:linear-gradient(135deg,var(--accent),#d44010);color:#fff;font-family:var(--font);font-size:.95rem;font-weight:700;border:none;cursor:pointer;transition:opacity .2s,transform .15s;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:24px}
.btn-login:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.btn-spin{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn-spin.show{display:block}
.login-back{margin-top:20px;text-align:center;font-size:.8rem;color:var(--text3)}
.login-back a{color:var(--accent);text-decoration:none}

/* ════ APP LAYOUT ════ */
#adminApp{display:flex;min-height:100vh}

/* ── Sidebar ── */
.sidebar{width:var(--sw);min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s ease;overflow-y:auto}
.sb-logo{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.sb-logo>span{font-size:1.6rem}
.sb-name{font-size:1.2rem;font-weight:700;letter-spacing:-.5px}
.sb-name span{color:var(--accent)}
.sb-tag{font-size:.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:500}
.sb-nav{flex:1;padding:12px 0}
.sb-section{font-size:.62rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text4);font-weight:600;padding:12px 20px 6px}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--text3);font-size:.88rem;font-weight:500;cursor:pointer;text-decoration:none;border-left:3px solid transparent;transition:all .15s;position:relative}
.sb-item:hover{color:var(--text);background:rgba(255,255,255,.04)}
.sb-item.active{color:var(--accent2);background:rgba(232,82,26,.08);border-left-color:var(--accent)}
.sb-item svg{width:16px;height:16px;flex-shrink:0}
.sb-badge{margin-left:auto;background:var(--blue);color:#fff;font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:10px;min-width:20px;text-align:center}
.sb-badge.danger{background:var(--red)}
.sb-badge:empty{display:none}
.sb-user{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--border)}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#d44010);display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;flex-shrink:0}
.sb-info{flex:1;overflow:hidden}
.sb-uname{font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-urole{font-size:.7rem;color:var(--text3)}
.sb-logout{background:none;border:none;color:var(--text4);cursor:pointer;padding:6px;border-radius:6px;transition:all .15s;display:flex}
.sb-logout:hover{color:var(--red);background:var(--red-bg)}
.sb-logout svg{width:16px;height:16px}

/* ── Main ── */
.adm-main{flex:1;margin-left:var(--sw);display:flex;flex-direction:column;min-height:100vh}
.topbar{height:var(--th);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:50}
.tb-burger{display:none;flex-direction:column;gap:4px;background:none;border:none;cursor:pointer;padding:6px}
.tb-burger span{display:block;width:18px;height:2px;background:var(--text3);border-radius:1px}
.tb-title{flex:1;font-size:1.05rem;font-weight:600}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-search{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 12px;transition:border-color .2s}
.tb-search:focus-within{border-color:var(--accent)}
.tb-search svg{width:14px;height:14px;color:var(--text4);flex-shrink:0}
.tb-search input{background:none;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:.85rem;width:180px}
.tb-search input::placeholder{color:var(--text4)}
.tb-bell{position:relative;width:36px;height:36px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;border:none}
.tb-bell:hover{background:var(--bg4)}
.tb-bell svg{width:16px;height:16px;color:var(--text3)}
.notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--bg2);display:none}
.page-content{flex:1;padding:28px 24px}

/* ════ STATS ════ */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px;position:relative;overflow:hidden;transition:border-color .2s,transform .15s}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:var(--r) var(--r) 0 0}
.stat-card.c-accent::before{background:var(--accent)}
.stat-card.c-green::before{background:var(--green)}
.stat-card.c-yellow::before{background:var(--yellow)}
.stat-card.c-blue::before{background:var(--blue)}
.stat-card.c-red::before{background:var(--red)}
.stat-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.sc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sc-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.sc-icon.c-accent{background:rgba(232,82,26,.12)}
.sc-icon.c-green{background:var(--green-bg)}
.sc-icon.c-yellow{background:var(--yellow-bg)}
.sc-icon.c-blue{background:var(--blue-bg)}
.sc-icon.c-red{background:var(--red-bg)}
.sc-val{font-size:2rem;font-weight:700;letter-spacing:-1px;font-family:var(--mono);margin-bottom:4px}
.sc-label{font-size:.82rem;color:var(--text3)}
.sc-sub{font-size:.75rem;color:var(--text4);margin-top:4px}

/* ════ TABLE CARD ════ */
.tbl-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.tbl-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:12px}
.tbl-head h3{font-size:.95rem;font-weight:600}
.tbl-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbl-search{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:6px 10px;transition:border-color .2s}
.tbl-search:focus-within{border-color:var(--accent)}
.tbl-search svg{width:13px;height:13px;color:var(--text4);flex-shrink:0}
.tbl-search input{background:none;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:.82rem;width:150px}
.tbl-sel{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--text);font-family:var(--font);font-size:.82rem;outline:none;cursor:pointer}
.tbl-sel:focus{border-color:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem}
thead th{padding:10px 16px;text-align:left;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text4);background:var(--bg3);border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody td{padding:12px 16px;color:var(--text2);vertical-align:middle}
tbody td:first-child{color:var(--text)}
.tbl-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--border);font-size:.8rem;color:var(--text3);flex-wrap:wrap;gap:10px}

/* ════ BADGES ════ */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;white-space:nowrap}
.badge::before{content:'';display:block;width:5px;height:5px;border-radius:50%}
.b-confirmed,.b-active,.b-approved{background:var(--green-bg);color:var(--green)}
.b-confirmed::before,.b-active::before,.b-approved::before{background:var(--green)}
.b-cancelled,.b-inactive,.b-rejected{background:var(--red-bg);color:var(--red)}
.b-cancelled::before,.b-inactive::before,.b-rejected::before{background:var(--red)}
.b-pending{background:var(--yellow-bg);color:var(--yellow)}
.b-pending::before{background:var(--yellow)}
.b-completed,.b-editor{background:var(--blue-bg);color:var(--blue)}
.b-completed::before,.b-editor::before{background:var(--blue)}
.b-admin{background:rgba(232,82,26,.12);color:var(--accent2)}
.b-admin::before{background:var(--accent)}
.b-user{background:var(--bg3);color:var(--text3)}
.b-user::before{background:var(--text4)}

/* ════ BUTTONS ════ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rs);font-family:var(--font);font-size:.84rem;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid transparent;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover:not(:disabled){background:var(--accent2)}
.btn-ghost{background:var(--bg3);color:var(--text2);border-color:var(--border)}
.btn-ghost:hover:not(:disabled){background:var(--bg4);color:var(--text)}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:rgba(239,68,68,.25)}
.btn-danger:hover:not(:disabled){background:rgba(239,68,68,.2)}
.btn-success{background:var(--green-bg);color:var(--green);border-color:rgba(34,197,94,.25)}
.btn-success:hover:not(:disabled){background:rgba(34,197,94,.2)}
.btn-sm{padding:5px 10px;font-size:.76rem}
.act-btns{display:flex;gap:6px;flex-wrap:wrap}

/* ════ FORMS ════ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid.g1{grid-template-columns:1fr}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr}
.ff{display:flex;flex-direction:column;gap:6px}
.ff.full{grid-column:1/-1}
.ff label{font-size:.78rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.ff input,.ff select,.ff textarea{padding:9px 12px;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:var(--font);font-size:.88rem;outline:none;transition:border-color .2s,box-shadow .2s}
.ff input:focus,.ff select:focus,.ff textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.ff textarea{resize:vertical;min-height:80px}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

/* ════ PAGINATION ════ */
.pager{display:flex;align-items:center;gap:6px}
.pg-btn{width:32px;height:32px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text3);font-family:var(--font);font-size:.82rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pg-btn:hover{border-color:var(--accent);color:var(--accent)}
.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}

/* ════ CHARTS ════ */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.chart-card h3{font-size:.9rem;font-weight:600;margin-bottom:16px;color:var(--text2)}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:120px}
.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-fill{width:100%;background:linear-gradient(to top,var(--accent),var(--accent2));border-radius:4px 4px 0 0;transition:height .5s ease;min-height:4px}
.bar-label{font-size:.62rem;color:var(--text4);white-space:nowrap}
.bar-val{font-size:.65rem;color:var(--text3);font-family:var(--mono)}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut-svg{width:100px;height:100px;flex-shrink:0}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.8rem}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.legend-name{color:var(--text2);flex:1}
.legend-pct{color:var(--text3);font-family:var(--mono);font-size:.76rem}

/* ════ ACTIVITY ════ */
.act-list{padding:0 4px}
.act-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.act-item:last-child{border-bottom:none}
.act-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.act-body{flex:1}
.act-title{font-size:.84rem;color:var(--text);margin-bottom:2px}
.act-meta{font-size:.75rem;color:var(--text4)}
.act-amt{font-size:.84rem;font-family:var(--mono);color:var(--green);white-space:nowrap}

/* ════ MODAL ════ */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-ov.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow);animation:modalIn .2s ease}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-hdr h3{font-size:1rem;font-weight:600}
.modal-x{background:none;border:none;color:var(--text4);cursor:pointer;font-size:1rem;padding:4px 8px;border-radius:4px;transition:all .15s}
.modal-x:hover{color:var(--red);background:var(--red-bg)}
.modal-body{padding:20px}
.modal-ftr{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* ════ TOAST ════ */
#toast{position:fixed;bottom:24px;right:24px;z-index:300;padding:12px 18px;border-radius:var(--rs);background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-size:.86rem;font-weight:500;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;max-width:340px;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}
#toast.ok{border-color:rgba(34,197,94,.3);color:var(--green)}
#toast.err{border-color:rgba(239,68,68,.3);color:var(--red)}

/* ════ SETTINGS ════ */
.set-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:20px;overflow:hidden}
.set-hdr{padding:16px 20px;border-bottom:1px solid var(--border);font-size:.9rem;font-weight:600}
.set-body{padding:20px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-info h4{font-size:.88rem;font-weight:500;margin-bottom:2px}
.set-info p{font-size:.78rem;color:var(--text3)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.di{display:flex;flex-direction:column;gap:3px}
.di-key{font-size:.72rem;color:var(--text4);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.di-val{font-size:.9rem;color:var(--text);font-weight:500}

/* ════ LOADING / EMPTY ════ */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;gap:12px;color:var(--text3);font-size:.88rem}
.loading-spin{width:20px;height:20px;border:2px solid var(--bg4);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-icon{font-size:3rem;margin-bottom:12px;opacity:.4}
.empty h4{font-size:1rem;color:var(--text2);margin-bottom:6px}

/* ════ PAGE HEADER ════ */
.page-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px}
.page-hdr h2{font-size:1.5rem;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.page-hdr p{font-size:.84rem;color:var(--text3)}

/* ════ RESPONSIVE ════ */
@media(max-width:768px){

  .sidebar{transform:translateX(-240px);width:240px}

  .stats-grid{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}

  .chart-grid{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}

}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr}
  .tb-search{display:none}
  .login-card{padding:28px 20px}
}

<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════
   BusGo Admin Panel — JS
════════════════════════════════════════════════════════════ */
const API = 'http://localhost:5000/api';
let token    = localStorage.getItem('busgo_admin_token') || null;
let me       = null;
let curPage  = 'dashboard';
let toastTmr;

/* ── XSS guard ──────────────────────────────────────────── */
const esc = s => {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
};

/* ── API fetch ──────────────────────────────────────────── */
async function api(method, path, body) {
  const headers = { 'Content-Type':'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const opts = { method, headers };
  if (body)  opts.body = JSON.stringify(body);
  try {
    const r    = await fetch(`${API}${path}`, opts);
    const data = await r.json().catch(() => ({ success:false, message:'Invalid response.' }));
    if (r.status === 401) {
      token = null; localStorage.removeItem('busgo_admin_token');
      showLogin(); toast('Session expired. Please login again.','err'); throw new Error('Session expired');
    }
    return data;
  } catch(e) { if (e.message !== 'Session expired') console.error('[Admin API]', e.message); throw e; }
}

/* ── Bootstrap ──────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('aPwd').addEventListener('keydown', e => { if (e.key === 'Enter') doAdminLogin(); });
  document.getElementById('aEmail').addEventListener('keydown', e => { if (e.key === 'Enter') doAdminLogin(); });
  token ? verifyAndLoad() : showLogin();
});

async function verifyAndLoad() {
  try {
    const d = await api('GET', '/auth/me');
    if (!d.success || !['admin','editor'].includes(d.user.role)) throw new Error('Not admin');
    me = d.user;
    showApp();
  } catch { token = null; localStorage.removeItem('busgo_admin_token'); showLogin(); }
}

/* ── Auth ───────────────────────────────────────────────── */
async function doAdminLogin() {
  const email = document.getElementById('aEmail').value.trim();
  const pwd   = document.getElementById('aPwd').value;
  clearAlert();
  if (!email || !/\S+@\S+\.\S+/.test(email)) { showAlert('Enter a valid email address.'); return; }
  if (!pwd || pwd.length < 6)                 { showAlert('Password must be at least 6 characters.'); return; }

  const btn  = document.getElementById('loginBtn');
  const spin = document.getElementById('loginSpin');
  const txt  = document.getElementById('loginBtnTxt');
  btn.disabled = true; spin.classList.add('show'); txt.textContent = 'Logging in…';

  try {
    const d = await api('POST', '/auth/login', { email, password:pwd });
    if (!d.success) { showAlert(d.message || 'Login failed.'); return; }
    if (!['admin','editor'].includes(d.user.role)) { showAlert('Access denied. Admin account required.'); return; }
    token = d.token; me = d.user;
    localStorage.setItem('busgo_admin_token', token);
    showApp();
  } catch(e) { showAlert(e.message || 'Cannot reach server. Is the backend running?'); }
  finally { btn.disabled = false; spin.classList.remove('show'); txt.textContent = 'Login to Admin Panel'; }
}

function doAdminLogout() {
  token = null; me = null;
  localStorage.removeItem('busgo_admin_token');
  showLogin(); toast('Logged out.');
}

function showLogin() {
  document.getElementById('loginScreen').style.display = '';
  document.getElementById('adminApp').style.display    = 'none';
}
function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminApp').style.display    = 'flex';
  if (me) {
    document.getElementById('sbName').textContent   = me.name;
    document.getElementById('sbRole').textContent   = cap(me.role);
    document.getElementById('sbAvatar').textContent = me.name.charAt(0).toUpperCase();
  }
  nav('dashboard');
}

function showAlert(msg) {
  const el = document.getElementById('loginAlert');
  el.textContent = msg; el.className = 'login-alert show';
}
function clearAlert() { document.getElementById('loginAlert').className = 'login-alert'; }
function togglePw() { const i = document.getElementById('aPwd'); i.type = i.type==='password'?'text':'password'; }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

/* ── Navigation ─────────────────────────────────────────── */
function nav(page) {
  curPage = page;
  document.querySelectorAll('.sb-item').forEach(el => el.classList.toggle('active', el.dataset.p === page));
  const titles = { dashboard:'Dashboard', users:'Users', bookings:'Bookings', buses:'Buses', refunds:'Refunds', settings:'Settings' };
  document.getElementById('tbTitle').textContent = titles[page] || page;
  document.getElementById('pageContent').innerHTML = `<div class="loading"><div class="loading-spin"></div>Loading…</div>`;
  ({ dashboard:renderDashboard, users:renderUsers, bookings:renderBookings, buses:renderBuses, refunds:renderRefunds, settings:renderSettings }[page] || (() => {
    document.getElementById('pageContent').innerHTML = `<div class="empty"><div class="empty-icon">🚧</div><h4>Coming Soon</h4></div>`;
  }))();
}

/* ════════════════════════════════════════════════════════════
   DASHBOARD
════════════════════════════════════════════════════════════ */
async function renderDashboard() {
  try {
    const d = await api('GET', '/admin/dashboard');
    if (!d.success) throw new Error(d.message);
    const { stats, recentBookings, recentUsers, bookingsByType, monthlyRevenue } = d;

    if (stats.pendingRefunds > 0) {
      document.getElementById('bdgRefunds').textContent = stats.pendingRefunds;
      document.getElementById('notifDot').style.display = '';
    }
    document.getElementById('bdgUsers').textContent = stats.users.total;

    document.getElementById('pageContent').innerHTML = `
      <div class="page-hdr fade-in">
        <div><h2>Dashboard</h2><p>Welcome back, ${esc(me?.name||'Admin')} 👋</p></div>
        <button class="btn btn-ghost" onclick="renderDashboard()">↻ Refresh</button>
      </div>
      <div class="stats-grid fade-in">
        ${sc('👥','Total Users',stats.users.total,stats.users.active+' active','c-blue')}
        ${sc('🎫','Total Bookings',stats.bookings.total,stats.bookings.confirmed+' confirmed','c-green')}
        ${sc('₹','Revenue','₹'+fmt(stats.revenue),stats.bookings.cancelled+' cancelled','c-accent')}
        ${sc('↩️','Pending Refunds',stats.pendingRefunds,'Awaiting action','c-red')}
        ${sc('🚌','Active Buses',stats.activeBuses,'In service','c-yellow')}
      </div>
      <div class="chart-grid fade-in">
        ${revenueChart(monthlyRevenue)}
        ${donutChart(bookingsByType)}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="fade-in">
        ${recentBkWidget(recentBookings)}
        ${recentUsWidget(recentUsers)}
      </div>`;
  } catch(e) { errState('Dashboard', e.message); }
}
const sc = (icon,label,val,sub,color) => `
  <div class="stat-card ${color}">
    <div class="sc-top"><div class="sc-icon ${color}">${icon}</div></div>
    <div class="sc-val">${esc(String(val))}</div>
    <div class="sc-label">${esc(label)}</div>
    <div class="sc-sub">${esc(String(sub))}</div>
  </div>`;
function revenueChart(mr) {
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const max    = Math.max(...mr.map(m=>m.revenue), 1);
  const bars   = mr.slice(-6).map(m => {
    const h = Math.max(8, m.revenue/max*100);
    return `<div class="bar-item"><div class="bar-val">₹${fmt(m.revenue)}</div><div class="bar-fill" style="height:${h}px"></div><div class="bar-label">${MONTHS[m._id.month-1]}</div></div>`;
  }).join('');
  return `<div class="chart-card"><h3>📈 Monthly Revenue</h3><div class="bar-chart">${bars||'<span style="color:var(--text4);font-size:.8rem">No data yet</span>'}</div></div>`;
}
function donutChart(bbt) {
  const colors = { AC:'#e8521a', Volvo:'#3b82f6', Sleeper:'#22c55e', 'Non-AC':'#f59e0b' };
  const total  = bbt.reduce((s,b) => s+b.count, 0) || 1;
  let offset   = 0;
  const slices = bbt.map(b => {
    const pct = b.count/total, len = pct*2*Math.PI*40, gap = 2*Math.PI*40-len;
    const color = colors[b._id]||'#64748b';
    const slice = `<circle cx="50" cy="50" r="40" fill="none" stroke="${color}" stroke-width="18" stroke-dasharray="${len} ${gap}" stroke-dashoffset="${-offset}" transform="rotate(-90 50 50)"/>`;
    offset += len;
    return { slice, label:b._id, pct:Math.round(pct*100), color };
  });
  const legend = slices.map(s=>`<div class="legend-item"><div class="legend-dot" style="background:${s.color}"></div><div class="legend-name">${esc(s.label)}</div><div class="legend-pct">${s.pct}%</div></div>`).join('');
  return `<div class="chart-card"><h3>🥧 Bookings by Type</h3><div class="donut-wrap"><svg class="donut-svg" viewBox="0 0 100 100">${slices.map(s=>s.slice).join('')}<text x="50" y="54" text-anchor="middle" fill="var(--text)" font-size="10" font-weight="700" font-family="Space Grotesk">${total}</text></svg><div>${legend||'<span style="color:var(--text4);font-size:.8rem">No data</span>'}</div></div></div>`;
}
function recentBkWidget(bks) {
  const rows = (bks||[]).slice(0,6).map(b=>`
    <div class="act-item">
      <div class="act-dot" style="background:${b.status==='confirmed'?'var(--green)':'var(--red)'}"></div>
      <div class="act-body"><div class="act-title">${esc(b.from)} → ${esc(b.to)}</div><div class="act-meta">${esc(b.userId?.name||'—')} · ${esc(b.busName)}</div></div>
      <div class="act-amt">₹${b.finalAmount}</div>
    </div>`).join('') || '<p style="color:var(--text3);font-size:.84rem;padding:16px">No bookings yet.</p>';
  return `<div class="tbl-card"><div class="tbl-head"><h3>🎫 Recent Bookings</h3><button class="btn btn-ghost btn-sm" onclick="nav('bookings')">View all →</button></div><div class="act-list" style="padding:0 16px">${rows}</div></div>`;
}
function recentUsWidget(users) {
  const rows = (users||[]).slice(0,5).map(u=>`
    <div class="act-item">
      <div class="sb-avatar" style="width:28px;height:28px;font-size:.75rem;flex-shrink:0">${esc(u.name.charAt(0))}</div>
      <div class="act-body"><div class="act-title">${esc(u.name)}</div><div class="act-meta">${esc(u.email)}</div></div>
      <span class="badge b-${u.role}">${esc(u.role)}</span>
    </div>`).join('') || '<p style="color:var(--text3);font-size:.84rem;padding:16px">No users yet.</p>';
  return `<div class="tbl-card"><div class="tbl-head"><h3>👤 Recent Users</h3><button class="btn btn-ghost btn-sm" onclick="nav('users')">View all →</button></div><div class="act-list" style="padding:0 16px">${rows}</div></div>`;
}

/* ════════════════════════════════════════════════════════════
   USERS
════════════════════════════════════════════════════════════ */
async function renderUsers(page=1, search='', role='', status='') {
  try {
    const p = new URLSearchParams({ page, limit:15, search, role, status });
    const d = await api('GET', `/admin/users?${p}`);
    if (!d.success) throw new Error(d.message);
    const { users, pagination:pg } = d;
    document.getElementById('pageContent').innerHTML = `
      <div class="page-hdr"><div><h2>Users</h2><p>${pg.total} total users</p></div></div>
      <div class="tbl-card fade-in">
        <div class="tbl-head">
          <h3>All Users</h3>
          <div class="tbl-tools">
            <div class="tbl-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input id="uSearch" placeholder="Name or email…" value="${esc(search)}" onkeydown="if(event.key==='Enter')renderUsers(1,this.value,document.getElementById('uRole').value,document.getElementById('uStatus').value)">
            </div>
            <select class="tbl-sel" id="uRole" onchange="renderUsers(1,document.getElementById('uSearch').value,this.value,document.getElementById('uStatus').value)">
              <option value="" ${!role?'selected':''}>All Roles</option>
              <option value="user" ${role==='user'?'selected':''}>User</option>
              <option value="editor" ${role==='editor'?'selected':''}>Editor</option>
              <option value="admin" ${role==='admin'?'selected':''}>Admin</option>
            </select>
            <select class="tbl-sel" id="uStatus" onchange="renderUsers(1,document.getElementById('uSearch').value,document.getElementById('uRole').value,this.value)">
              <option value="" ${!status?'selected':''}>All Status</option>
              <option value="active" ${status==='active'?'selected':''}>Active</option>
              <option value="inactive" ${status==='inactive'?'selected':''}>Inactive</option>
            </select>
          </div>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>User</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>Wallet</th><th>Joined</th><th>Actions</th></tr></thead>
            <tbody>${users.length ? users.map(u=>`
              <tr>

/* ════════════════════════════════════════════════════════════
   UTILITIES
════════════════════════════════════════════════════════════ */
function openModal(title, body, btns=[]) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML    = body;
  document.getElementById('modalFtr').innerHTML     = btns.map(b=>`<button class="btn ${b.c}" onclick="${b.fn}">${b.l}</button>`).join('');
  document.getElementById('modalOv').classList.add('show');
}
function closeModal() { document.getElementById('modalOv').classList.remove('show'); }

function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `show ${type}`;
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => el.classList.remove('show'), 3000);
}

function pager(pg, tpl) {
  if (pg.pages <= 1) return '';
  let h = '<div class="pager">';
  h += `<button class="pg-btn" onclick="${tpl(pg.page-1)}" ${pg.page<=1?'disabled':''}>‹</button>`;
  for (let i=1; i<=pg.pages; i++) {
    if (i===1||i===pg.pages||Math.abs(i-pg.page)<=1)
      h += `<button class="pg-btn ${i===pg.page?'active':''}" onclick="${tpl(i)}">${i}</button>`;
    else if (Math.abs(i-pg.page)===2) h += `<span style="padding:0 4px;color:var(--text4)">…</span>`;
  }
  h += `<button class="pg-btn" onclick="${tpl(pg.page+1)}" ${pg.page>=pg.pages?'disabled':''}>›</button>`;
  return h + '</div>';
}

function errState(pg, msg) {
  document.getElementById('pageContent').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><h4>Failed to load ${esc(pg)}</h4><p>${esc(msg)}</p><button class="btn btn-ghost" style="margin-top:16px" onclick="nav('${esc(curPage)}')">Try Again</button></div>`;
}

function globalSearch() {
  const q = document.getElementById('gSearch').value.trim();
  if (!q) return;
  nav('bookings');
  setTimeout(() => { const el = document.getElementById('bSearch'); if (el) { el.value = q; renderBookings(1,'',q); } }, 300);
}
